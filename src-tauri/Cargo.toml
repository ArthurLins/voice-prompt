[package]
name = "voice-prompt"
version = "0.7.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/ArthurLins/voice-prompt"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "sync", "fs", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
eventsource-stream = "0.2"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
